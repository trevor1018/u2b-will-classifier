name: Weekly refresh

# Pull the channel + re-classify, commit if anything changed.
# Triggered weekly + manually. Requires GitHub repo secrets:
#   - YOUTUBE_API_KEY
#   - ANTHROPIC_API_KEY

on:
  schedule:
    # 每週日 02:00 (UTC+8) = 每週六 18:00 UTC
    - cron: "0 18 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Plain refresh: classify only NEW videos (city-level via the LLM
        # prompt's world knowledge) + Nominatim geocoding. Cheap and enough —
        # new videos land at city level (verified 2026-09-16). The heavier
        # passes (--refine-geo re-churns the whole weak set, --web-search-geo
        # re-searches every week) drained the account's credit, so they now
        # run on-demand only:  python scripts/refresh.py --refine-geo
        #                      python scripts/refresh.py --web-search-geo
        #                      python scripts/extract_years_websearch.py
        # Manual pins + years survive because the cache is derived from the
        # committed cases.json.
        run: python scripts/refresh.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/cases.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "data: weekly refresh of X調查 cases"
            git push
          fi
