name: Weekly refresh

# Pull the channel + re-classify, commit if anything changed.
# Triggered weekly + manually. Requires GitHub repo secrets:
#   - YOUTUBE_API_KEY
#   - ANTHROPIC_API_KEY

on:
  schedule:
    # 每週日 02:00 (UTC+8) = 每週六 18:00 UTC
    - cron: "0 18 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Match the manually-tuned geo-lookup strength, incrementally:
        #  1. --refine-geo : full base refresh (fetch + classify NEW videos +
        #     Nominatim + build) AND re-classify any weak entries lacking a
        #     specific city/coords. LLM-only, ~$0.12.
        #  2. --web-search-geo : for cases still unpinnable from title/desc,
        #     use Claude web_search. Self-limiting — skips entries that already
        #     have coords + a geocodable city — so a weekly run only searches
        #     the handful of new stubborn cases (~<$0.20/run; real web_search
        #     cost ≈ $0.09/call, not the $0.01 in the flag's help text).
        # Manual pins survive both: they carry specific city+coords, so
        # --refine-geo never evicts them and web_search skips them.
        run: |
          python scripts/refresh.py --refine-geo
          python scripts/refresh.py --web-search-geo

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/cases.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "data: weekly refresh of X調查 cases"
            git push
          fi
